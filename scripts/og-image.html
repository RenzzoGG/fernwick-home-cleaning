<!DOCTYPE html>
<!--
  Plantilla de la imagen Open Graph (1200×630). NO se publica: copy-static.mjs
  solo copia index.html, js/ y assets/. Para regenerar assets/og-image.png:
    "/mnt/c/Program Files/Google/Chrome/Application/chrome.exe" --headless \
      --hide-scrollbars --window-size=1200,630 \
      --screenshot="$(wslpath -w assets)\og-image.png" "$(wslpath -w scripts/og-image.html)"
  Colores y fuentes copiados de styles/input.css (@theme).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fernwick — Open Graph image</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 96px;
      font-family: "Plus Jakarta Sans", sans-serif;
      color: #334155;
      background: linear-gradient(to bottom right, #f0fdfa, #ffffff, #e0f2fe);
    }
    /* Manchas difuminadas, como en el hero */
    .blob { position: absolute; z-index: -1; border-radius: 9999px; filter: blur(64px); }
    .blob-a { top: -120px; right: -100px; width: 480px; height: 480px; background: rgb(153 246 228 / 0.7); }
    .blob-b { bottom: -180px; left: -120px; width: 560px; height: 560px; background: rgb(186 230 253 / 0.7); }

    .brand { display: flex; align-items: center; gap: 20px; }
    .logo { width: 88px; height: 88px; }
    .name { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 44px; color: #0f172a; }
    h1 {
      margin-top: 44px;
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: 76px;
      line-height: 1.08;
      color: #0f172a;
    }
    h1 span { color: #0f766e; }
    .tagline { margin-top: 24px; font-size: 30px; font-weight: 500; color: #475569; }
    .url {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 44px;
      align-self: flex-start;
      padding: 14px 28px;
      border-radius: 9999px;
      background: #0f766e;
      color: #fff;
      font-size: 26px;
      font-weight: 600;
    }
    .dot { width: 12px; height: 12px; border-radius: 9999px; background: #5eead4; }
  </style>
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0f766e"/><g fill="none" stroke="#ccfbf1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(4 4)"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></g></svg>
    <span class="name">Fernwick Home Cleaning</span>
  </div>

  <h1>A spotless home, <span>without<br>lifting a finger.</span></h1>
  <p class="tagline">Concept landing page for a home cleaning service</p>

  <p class="url"><span class="dot"></span>fernwick.renzzogg.com</p>
</body>
</html>
